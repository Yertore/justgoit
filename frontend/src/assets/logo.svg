<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="JustGoIt">
  <title>JustGoIt</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00C5E6"/>
      <stop offset="1" stop-color="#006ECD"/>
    </linearGradient>
    <linearGradient id="glight" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- short rounded rectangle -->
  <rect x="8" y="8" width="264" height="64" rx="12" fill="url(#g)"/>
  <rect x="8" y="8" width="264" height="64" rx="12" fill="url(#glight)" />

  <!-- single-line merged wordmark, чуть увеличенный текст, "Go" выделено -->
  <text x="140" y="54" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial"
        font-weight="800" font-size="46" letter-spacing="0">
    <tspan fill="#ffffff">Just</tspan><tspan fill="#FFD166">Go</tspan><tspan fill="#ffffff">It</tspan>
  </text>

  <desc>JustGoIt — merged wordmark with highlighted "Go". Text size increased slightly.</desc>
</svg>